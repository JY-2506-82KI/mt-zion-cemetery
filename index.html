<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT ZION CEMETERY</title>
    
    <!--Custom Favicon-->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Libre Baskerville Font -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }
    #header {
        background: #2c3e50;
        color: white;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 2000;
    }
    
    /* Search Box & Autocomplete Dropdown Container */
    #search-container { 
        position: relative;            /* <--- THIS IS WHAT WAS MISSING */
        width: 90%;                    
        max-width: 350px;              
        box-sizing: border-box;       
        margin: 0 auto;               
    }
    #search-input {
    width: 100%;                 /* Fills the container perfectly */
    box-sizing: border-box;      /* Prevents padding from breaking the width */
    font-size: 16px;             /* Keeps iOS from auto-zooming */
    }
    #search-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: white;
        color: #333;
        border-radius: 0 0 4px 4px;
        border: 1px solid #ccc;
        border-top: none;
        max-height: 250px;
        overflow-y: auto;
        display: none;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        z-index: 3000;
    }
    .search-result-item {
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
    }
    .search-result-item:hover {
        background: #f1f2f6;
    }
    .search-result-item strong {
        color: #2980b9;
    }

    #map {
        flex-grow: 1;
        width: 100%;
        z-index: 1;
    }
    .leaflet-popup-content h3 {
        margin: 0 0 5px 0;
        color: #2c3e50;
    }
    .leaflet-popup-content p {
        margin: 4px 0;
        font-size: 13px;
    }

    /* Base style for lot numbers */
    .lot-label {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        color: #ffffff;
        font-weight: bold;
        font-size: 11px;
        text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
        transition: opacity 0.2s ease-in-out;
    }

    /* Smoothly hides lot labels when zoomed out past 20 */
    #map.hide-lot-labels .lot-label {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }
</style>
</head>
<body>

    <div id="header">
        <!-- Libre Baskerville Silver Title -->
        <div style="font-family: 'Libre Baskerville', serif; font-size: 15px; font-weight: bold; color: #d7dbdd; letter-spacing: 1px;">
            MT. ZION CEMETERY
        </div>

        <!-- Controls Group -->
        <div style="display: flex; gap: 15px; align-items: center;">
            <!-- Layer Toggles -->
            <label style="font-family: 'Libre Baskerville', serif; font-size: 13px; cursor: pointer; color: #d7dbdd;">
                <input type="checkbox" id="toggle-lots" checked> Lots
            </label>
            <label style="font-family: 'Libre Baskerville', serif; font-size: 13px; cursor: pointer; color: #d7dbdd;">
                <input type="checkbox" id="toggle-plots"> Plots
            </label>
            <!-- Search Input with Dropdown Container -->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search lots or burial records...">
                <div id="search-results"></div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    // 1. Initialize the Map
    const map = L.map('map').setView([37.0, -91.5], 18);

    // 2. Add Satellite Imagery
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 22,
        maxNativeZoom: 19,
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-eGP, and the GIS User Community'
    }).addTo(map);

    let plotsLayerGroup = L.layerGroup();
    let lotsLayer; 
    let searchIndex = []; // Stores combined searchable items for autocomplete

    // Zoom watcher strictly for lot label clutter control (zoom < 20 hides lot numbers)
    map.on('zoomend', function() {
        const currentZoom = map.getZoom();
        const mapElement = document.getElementById('map');
        
        if (currentZoom < 20) {  
            mapElement.classList.add('hide-lot-labels');
        } else {
            mapElement.classList.remove('hide-lot-labels');
        }
    });

    // 3. Load Lots (Background Boundaries + Indexing into Search)
    fetch('lots.geojson')
        .then(response => response.json())
        .then(data => {
            lotsLayer = L.geoJSON(data, {
                style: function(feature) {
                    const props = feature.properties;
                    const status = (props.status || "").toLowerCase();
                    const hasName = props.name && props.name.trim() !== "";

                    // Professional Palette: Soft Sage for Available, Slate Blue for Owned/Sold
                    if (status.includes('available') || status.includes('for sale') || !hasName) {
                        return { 
                            color: "#27ae60",      // Deep sage border
                            weight: 1.5, 
                            fillColor: "#2ecc71",  // Soft sage fill
                            fillOpacity: 0.15      // Gentle transparency so satellite view shines through
                        };
                    } else {
                        return { 
                            color: "#34495e",      // Dark slate border
                            weight: 1.5, 
                            fillColor: "#576574",  // Professional muted slate/gray fill
                            fillOpacity: 0.25 
                        };
                    }
                },
                onEachFeature: function(feature, layer) {
                    const props = feature.properties;
                    const lotNo = props.lot_no || ''; 
                    const ownerName = props.name ? props.name.trim() : '';
                    const lotStatus = props.status ? props.status.trim() : (ownerName ? 'Sold' : 'Available');

                    if (lotNo) {
                        layer.bindTooltip(lotNo, {
                            permanent: true,
                            direction: 'center',
                            className: 'lot-label'
                        });
                    }

                    const popupContent = `
                        <div style="font-family: Arial, sans-serif; font-size: 13px; line-height: 1.4;">
                            <strong>Lot Number:</strong> ${lotNo}<br>
                            <strong>Status:</strong> <span style="color: ${ownerName ? '#576574' : '#27ae60'}; font-weight: bold;">${lotStatus}</span><br>
                            <strong>Owner / Name:</strong> ${ownerName || 'None (Open / Available)'}
                        </div>
                    `;

                    layer.on({
                        mouseover: function(e) {
                            e.target.setStyle({ weight: 2.5, fillOpacity: 0.4 });
                            layer.bindPopup(popupContent, { offset: [0, -10] }).openPopup(e.latlng);
                        },
                        mouseout: function(e) {
                            lotsLayer.resetStyle(e.target);
                            layer.closePopup();
                        }
                    });

                    // Add Lot to Search Index
                    if (lotNo || ownerName) {
                        searchIndex.push({
                            type: 'Lot',
                            display: `📍 Lot ${lotNo} — Owner: ${ownerName || 'Available'}`,
                            searchText: `${lotNo} ${ownerName}`.toLowerCase(),
                            layer: layer,
                            zoomLevel: 19
                        });
                    }
                }
            }).addTo(map);

            if (data.features.length > 0) {
                map.fitBounds(lotsLayer.getBounds());
            }
        }).catch(err => console.log("Lots geojson optional load note:", err));

    // --- Obituary Modal & Fetch Helpers ---
    function viewObituary(name, dates, fileUrl) {
        fetch(fileUrl)
            .then(response => {
                if (!response.ok) throw new Error("Obituary file not found");
                return response.text();
            })
            .then(text => {
                const formattedText = text.replace(/\n/g, '<br>');
                showObituaryModal(name, dates, formattedText);
            })
            .catch(err => {
                console.error(err);
                alert("Could not load the obituary file for this plot.");
            });
    }

    function showObituaryModal(title, subtitle, content) {
        let modal = document.getElementById('obituary-modal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'obituary-modal';
            modal.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center;z-index:99999;";
            modal.innerHTML = `
                <div style="background:white;padding:25px;border-radius:8px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 4px 15px rgba(0,0,0,0.3);font-family:sans-serif;position:relative;">
                    <h2 id="modal-title" style="margin-top:0;color:#2c3e50;"></h2>
                    <h4 id="modal-subtitle" style="color:#7f8c8d;margin-top:-10px;font-style:italic;"></h4>
                    <hr style="border:0;border-top:1px solid #eee;margin:15px 0;">
                    <div id="modal-body" style="line-height:1.6;color:#333;font-size:14px;white-space:pre-wrap;"></div>
                    <button onclick="document.getElementById('obituary-modal').style.display='none'" style="margin-top:20px;background:#34495e;color:white;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;float:right;">Close</button>
                </div>
            `;
            document.body.appendChild(modal);
        }
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-subtitle').innerText = subtitle;
        document.getElementById('modal-body').innerHTML = content;
        modal.style.display = 'flex';
    }

    // --- Sidebar Panel Helper (Option 1) ---
    function showPlotSidebar(displayName, dateString, obituaryPath) {
        let sidebar = document.getElementById('plot-sidebar');
        if (!sidebar) {
            sidebar = document.createElement('div');
            sidebar.id = 'plot-sidebar';
            sidebar.style.cssText = "position:fixed;top:0;right:0;width:320px;height:100%;background:white;box-shadow:-4px 0 15px rgba(0,0,0,0.15);z-index:9999;padding:25px;box-sizing:border-box;font-family:sans-serif;display:flex;flex-direction:column;transition:transform 0.3s ease;";
            document.body.appendChild(sidebar);
        }

        sidebar.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #eee;padding-bottom:15px;margin-bottom:15px;">
                <h2 style="margin:0;color:#2c3e50;font-size:20px;line-height:1.2;">${displayName || 'Unassigned / Available'}</h2>
                <button onclick="document.getElementById('plot-sidebar').style.transform='translateX(100%)'" style="background:none;border:none;font-size:20px;cursor:pointer;color:#7f8c8d;padding:0 5px;">&times;</button>
            </div>
            <p style="margin: 0 0 15px 0; font-size: 14px; color: #555;"><strong>Dates:</strong> ${dateString}</p>
            <div id="sidebar-obit-slot" style="margin-top:5px;"></div>
        `;

        sidebar.style.transform = 'translateX(0)';

        // Check if obituary file exists on GitHub
        if (obituaryPath) {
            const obitSlot = document.getElementById('sidebar-obit-slot');
            fetch(obituaryPath, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        obitSlot.innerHTML = `
                            <div style="border-top: 1px solid #eee; padding-top: 15px;">
                                <a href="javascript:void(0);" onclick="viewObituary('${displayName.replace(/'/g, "\\'")}', '${dateString}', '${obituaryPath}')" 
                                   style="display:inline-block;background:#2980b9;color:white;text-decoration:none;font-weight:bold;font-size:13px;padding:8px 14px;border-radius:4px;">
                                   📄 Read Obituary
                                </a>
                            </div>
                        `;
                    }
                })
                .catch(() => {});
        }
    }

    // 4. Load Plots (Interactive Burial Records + Indexing into Search)
    fetch('plots.geojson')
        .then(response => response.json())
        .then(data => {
            const geoJsonLayer = L.geoJSON(data, {
                style: function(feature) {
                    const props = feature.properties;
                    const fullName = props.full_name ? props.full_name.trim() : '';

                    if (fullName !== "") {
                        return { color: "#c0392b", weight: 1, fillColor: "#e74c3c", fillOpacity: 0.45 };
                    } else {
                        return { color: "#7f8c8d", weight: 1, fillColor: "#bdc3c7", fillOpacity: 0.3 };
                    }
                },
                onEachFeature: function(feature, layer) {
                    const props = feature.properties;
                    const plotId = props.plot_id || ''; // e.g., "1-1"
                    const fullName = props.full_name || '';
                    const maidenName = props.maiden_name ? props.maiden_name.trim() : '';
                    const lotNumber = props.lot_no || ''; 
                    const birth = props.birth_date || '?';
                    const death = props.death_date || '?';

                    const displayName = maidenName ? `${fullName} (${maidenName})` : fullName;
                    const dateString = `${birth} – ${death}`; // Used for obituary modal header

                    // Extract 4-digit years for hover tooltip
                    const birthYear = props.birth_date ? (String(props.birth_date).match(/\d{4}/)?.[0] || null) : null;
                    const deathYear = props.death_date ? (String(props.death_date).match(/\d{4}/)?.[0] || null) : null;
                    const hoverDateString = `${birthYear || '?'} – ${deathYear || '?'}`;

                    // Only bind hover tooltips if the plot is occupied
                    if (fullName) {
                        const hoverContent = `
                            <div style="font-family: Arial, sans-serif; font-size: 12px; line-height: 1.3; text-align: center;">
                                <strong>${displayName}</strong><br>
                                <span style="font-size: 11px; color: #555;">${hoverDateString}</span>
                            </div>
                        `;

                        layer.bindTooltip(hoverContent, {
                            direction: 'top',
                            offset: [0, -5],
                            className: 'plot-hover-tooltip'
                        });
                    }

                    // Smart Hybrid Age Calculation
                    let ageString = '';
                    const birthRaw = props.birth_date ? String(props.birth_date).trim() : '';
                    const deathRaw = props.death_date ? String(props.death_date).trim() : '';

                    const isFullDate = (str) => /^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(str) || /^\d{1,2}[-/]\d{1,2}[-/]\d{4}$/.test(str);

                    if (isFullDate(birthRaw) && isFullDate(deathRaw)) {
                        const bDate = new Date(birthRaw);
                        const dDate = new Date(deathRaw);
                        if (!isNaN(bDate.getTime()) && !isNaN(dDate.getTime())) {
                            let age = dDate.getFullYear() - bDate.getFullYear();
                            const m = dDate.getMonth() - bDate.getMonth();
                            if (m < 0 || (m === 0 && dDate.getDate() < bDate.getDate())) {
                                age--;
                            }
                            if (age >= 0) {
                                ageString = `<p style="margin: 3px 0; font-size: 13px; color: #555;"><strong>Age:</strong> ${age} years</p>`;
                            }
                        }
                    }

                    if (!ageString && birthYear && deathYear) {
                        const bY = parseInt(birthYear, 10);
                        const dY = parseInt(deathYear, 10);
                        const diff = dY - bY;
                        if (diff >= 0) {
                            ageString = `<p style="margin: 3px 0; font-size: 13px; color: #555;"><strong>Age:</strong> ~${diff} years</p>`;
                        }
                    }

                    // Pull lot owner property safely
                    const lotOwner = props.lot_owner ? `<p style="margin: 3px 0; font-size: 13px; color: #555;"><strong>Lot Owner:</strong> ${props.lot_owner}</p>` : '';

                    // Build clean popup content with Birth, Death, Age, and Lot Owner
                    let popupContent = `
                        <div style="font-family: Arial, sans-serif; min-width: 180px;">
                            <h3 style="margin: 0 0 5px 0; color: #2c3e50;">${displayName || 'Unassigned / Available'}</h3>
                            <p style="margin: 3px 0; font-size: 13px; color: #555;"><strong>Birth:</strong> ${birth}</p>
                            <p style="margin: 3px 0; font-size: 13px; color: #555;"><strong>Death:</strong> ${death}</p>
                            ${ageString}
                            ${lotOwner}
                            <div class="obit-link-slot" style="margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; display: none;"></div>
                        </div>
                    `;

                    layer.bindPopup(popupContent);

                    // When the popup opens, check if the corresponding obituary text file exists on GitHub
                    layer.on('popupopen', function() {
                        if (!plotId) return;
                        const obituaryPath = `obituaries/${plotId}.txt`;
                        const popupEl = layer.getPopup().getElement();
                        const slot = popupEl ? popupEl.querySelector('.obit-link-slot') : null;
                        
                        // Only check once per popup open session to save resources
                        if (slot && !slot.dataset.checked) {
                            slot.dataset.checked = "true";
                            
                            fetch(obituaryPath, { method: 'HEAD' })
                                .then(response => {
                                    if (response.ok) {
                                        // File exists! Reveal the button link.
                                        slot.style.display = 'block';
                                        slot.innerHTML = `
                                            <a href="javascript:void(0);" onclick="viewObituary('${displayName.replace(/'/g, "\\'")}', '${dateString}', '${obituaryPath}')" 
                                               style="color: #2980b9; text-decoration: none; font-weight: bold; font-size: 13px;">
                                               📄 Read Obituary
                                            </a>
                                        `;
                                    }
                                })
                                .catch(() => {
                                    // File doesn't exist, keep the slot hidden.
                                });
                        }
                    });

                    // Hover outline effect
                    layer.on({
                        mouseover: function(e) { e.target.setStyle({ weight: 2.5, fillOpacity: 0.6 }); },
                        mouseout: function(e) { geoJsonLayer.resetStyle(e.target); }
                    });

                    // Add Burial Plot to Search Index
                    if (fullName) {
                        searchIndex.push({
                            type: 'Burial Record',
                            display: `🪦 Burial: ${displayName} (Lot ${lotNumber || 'N/A'})`,
                            searchText: `${fullName} ${maidenName} ${lotNumber} ${props.lot_owner || ''}`.toLowerCase(),
                            layer: layer,
                            zoomLevel: 21,
                            isPlot: true
                        });
                    }
                }
            }).addTo(plotsLayerGroup); 
        }).catch(err => console.log("Plots geojson optional load note:", err));
    // 5. Header Toggle Event Listeners
    document.getElementById('toggle-lots').addEventListener('change', function(e) {
        if (e.target.checked) {
            if (lotsLayer) map.addLayer(lotsLayer);
        } else {
            if (lotsLayer) map.removeLayer(lotsLayer);
        }
    });

    document.getElementById('toggle-plots').addEventListener('change', function(e) {
        if (e.target.checked) {
            map.addLayer(plotsLayerGroup);
        } else {
            map.removeLayer(plotsLayerGroup);
        }
    });

    // 6. Autocomplete & Search Bar Logic
    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('search-results');

    searchInput.addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase().trim();
        resultsContainer.innerHTML = '';
        
        if (query.length === 0) {
            resultsContainer.style.display = 'none';
            return;
        }

        // Filter search index for matches
        const matches = searchIndex.filter(item => item.searchText.includes(query)).slice(0, 15); // limit to 15 suggestions

        if (matches.length > 0) {
            resultsContainer.style.display = 'block';
            matches.forEach(match => {
                const div = document.createElement('div');
                div.className = 'search-result-item';
                div.innerHTML = match.display;
                
                // Click handler for suggestion item
                div.addEventListener('click', function() {
                    searchInput.value = '';
                    resultsContainer.style.display = 'none';

                    if (!match.layer) return;

                    // 1. Handle Layer Toggles & Ensure Visibility
                    if (match.isPlot) {
                        document.getElementById('toggle-plots').checked = true;
                        if (!map.hasLayer(plotsLayerGroup)) {
                            map.addLayer(plotsLayerGroup);
                        }
                    } else {
                        document.getElementById('toggle-lots').checked = true;
                        if (lotsLayer && !map.hasLayer(lotsLayer)) {
                            map.addLayer(lotsLayer);
                        }
                    }

                    // 2. Get the exact center coordinates of the polygon
                    const bounds = match.layer.getBounds();
                    const centerPoint = bounds.getCenter();

                    // 3. Center and zoom the map
                    map.setView(centerPoint, match.zoomLevel);

                    // 4. Give layers time to render (lots need a bit more time than plots)
                    const delay = match.isPlot ? 150 : 400;

                    setTimeout(() => {
                        // Use your layer's original popup content, forcing it open at the center coordinates
                        if (match.layer.getPopup && match.layer.getPopup()) {
                            const content = match.layer.getPopup().getContent();
                            L.popup()
                              .setLatLng(centerPoint)
                              .setContent(content)
                              .openOn(map);
                        } else {
                            match.layer.openPopup(centerPoint);
                        }
                    }, delay);
                });

                resultsContainer.appendChild(div);
            });
        } else {
            resultsContainer.style.display = 'none';
        }
    });

    // Hide dropdown when clicking outside
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-container')) {
            resultsContainer.style.display = 'none';
        }
    });
    </script>
</body>
</html>
